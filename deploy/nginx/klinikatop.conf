# Shifo — ALOHIDA server bloki.
# banisa.uz konfiguratsiyasiga tegilmaydi: nginx so'rovni server_name
# bo'yicha ajratadi, ikkalasi bir-birini bilmaydi.
#
# Yoqish (domen tayyor bo'lgach):
#   sed -i 's/klinikatop.uz www.klinikatop.uz/shifo.example.uz/g' /etc/nginx/sites-available/klinikatop
#   ln -s /etc/nginx/sites-available/klinikatop /etc/nginx/sites-enabled/klinikatop
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d shifo.example.uz

#
# KIRISH sahifalari qidiruvga tushmasin.
#
# Nega `location` emas, `map`:
#
# SPA ning HAMMA manzili `try_files` orqali `/app.html` ga tushadi,
# ya'ni javobni oxirida `location = /app.html` beradi. O'sha blokda
# o'z `add_header` i bor va u — nginx qoidasi bo'yicha — yuqoridagi
# barcha `add_header` larni BEKOR qiladi. Shuning uchun `/kabinet`
# uchun alohida blok yozish ish bermadi: sarlavha javobga umuman
# yetib bormadi (shu faylning yuqorisidagi ogohlantirishga qarang).
#
# `map` esa sarlavhaning QIYMATINI hisoblaydi va uni o'sha yagona
# blokda qo'shamiz. `$request_uri` ichki yo'naltirishdan keyin ham
# ASL manzilda qoladi — `$uri` esa `/app.html` ga o'zgaradi.
#
# Qiymat bo'sh bo'lsa nginx sarlavhani umuman qo'shmaydi, ya'ni
# bosh sahifa va bemor ilovasi indekslanaveradi.
#
# Bu ruxsatni almashtirmaydi — kabinet baribir parol so'raydi.
# Maqsad boshqa: kirish sahifasini e'lon qilib qo'ymaslik.
#
map $request_uri $klinikatop_robots {
    default    "";
    ~^/kabinet "noindex, nofollow";
    ~^/admin   "noindex, nofollow";
    # Bemor ilovasi — shaxsiy ekranlar, qidiruvga kerak emas
    ~^/app     "noindex, nofollow";
    # Shifokor kabineti — faqat Telegram ichida ochiladi
    ~^/doctor  "noindex, nofollow";
}

server {
    server_name klinikatop.uz www.klinikatop.uz;

    root /opt/klinikatop/webapp;
    index index.html;

    # nginx versiyasi javob sarlavhasida ko'rinmasin
    server_tokens off;

    include /etc/nginx/snippets/klinikatop-security.conf;

    # ── Siqish ──
    #
    # nginx.conf da `gzip on` bor, lekin `gzip_types` izohga olingan va
    # sukut bo'yicha faqat text/html siqiladi. Natijada JS va CSS xom
    # holda ketardi: 203 KB o'rniga 59 KB bo'lishi mumkin edi.
    #
    # Sekin mobil tarmoqda bu farq bir necha soniya — ilova "og'ir
    # ishlaydi" degan tuyg'u aynan shundan.
    #
    # Sozlama SHU BLOK ichida: banisa.uz konfiguratsiyasiga tegilmaydi.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    # 1 KB dan kichigini siqish foyda bermaydi — sarlavha o'zi shuncha
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    #
    # Ikki ilova bitta ildizda (deploy/merge-site.mjs):
    #
    #   /, /ru/, /klinikalar-uchun/ …  → ochiq sayt, statik HTML (SEO)
    #   qolgan hamma manzil             → bemor ilovasi va kabinet (app.html)
    #
    # `$uri/index.html` — sayt sahifasi papka ichida. Topilmasa SPA.
    # Bu blokdagi fayllar (sayt HTML, favicon, robots) keshlanmaydi,
    # faqat qayta tekshiriladi — ular hash'siz nomlangan.
    #
    #
    # Ochiq sayt sahifalari — Node shablonni admin o'zgartirgan matn, video,
    # rasmlar va hamkorlar bilan to'ldirib beradi (services/siteContent.ts).
    # Qayta build kerak emas. Node ishlamasa yoki sahifani topmasa — statik
    # shablon beriladi, ya'ni sayt hech qachon yiqilmaydi.
    #
    location ~ ^/(ru/)?(klinikalar-uchun|dlya-klinik|royxatdan-otish|registratsiya|kirish|vkhod)?/?$ {
        rewrite ^ /__site$uri break;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @site_static;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    location @site_static {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    location / {
        try_files $uri $uri/index.html /app.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    #
    # `index.html` HECH QACHON keshlanmaydi.
    #
    # U hash bilan nomlangan JS fayllarga ishora qiladi va har deploy'da
    # eski fayllar o'chiriladi. Sarlavhasiz brauzer (ayniqsa Telegram
    # WebView) index.html ni evristik bilan keshlab qo'yardi — natijada
    # eski qobiq allaqachon yo'q bo'lgan skriptni chaqirib, ilova
    # umuman ochilmasdi (qora ekran).
    #
    # Asset'lar esa immutable bo'lib qolaveradi: ular hash bilan
    # nomlangan, ya'ni o'zgarsa nomi ham o'zgaradi.
    #
    location = /app.html {
        # `expires` o'zining Cache-Control ini qo'shadi — sarlavha
        # ikki marta chiqmasligi uchun faqat bittasi ishlatiladi
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Kirish sahifalarida "indekslama"; qolganida qiymat bo'sh
        # bo'ladi va sarlavha qo'shilmaydi
        add_header X-Robots-Tag $klinikatop_robots always;
        # Bu blokdagi `add_header` yuqoridagilarni bekor qiladi —
        # shuning uchun xavfsizlik sarlavhalari qayta ulanadi
        include /etc/nginx/snippets/klinikatop-security.conf;
        #
        # Ilova (bemor, klinika kabineti, admin) uchun QAT'IY CSP.
        # Kabinet va admin tokenlari localStorage'da — XSS topilsa ham
        # begona skript ishlamasin va ma'lumotni boshqa saytga jo'nata
        # olmasin. Inline skript yo'q (mavzu `/theme-boot.js` da).
        # `frame-ancestors` umumiy snippet'dagi ikkinchi CSP'da — brauzer
        # ikkalasini ham qo'llaydi.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://klinikatop.uz wss://klinikatop.uz; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Ochiq sayt asset'lari (Astro) — ular ham hash bilan
    location /_site/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    # Hash bilan nomlangan asset'lar
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI javobi SSE bilan oqadi — buferlash oqimni to'xtatadi
        proxy_buffering off;
        proxy_read_timeout 120s;

        # Tibbiy hujjat 8 MB, base64 bilan ~11 MB
        client_max_body_size 12m;

        # Chegaradan oshsa nginx HTML sahifa beradi — ilova uni
        # o'qiy olmaydi va "xatolik" deb qo'ya qoladi. JSON bo'lsin.
        error_page 413 = @too_large;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":"Fayl juda katta — 8 MB gacha bo‘lsin","code":"file_too_large"}';
    }

    location /ws {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/klinikatop.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klinikatop.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.klinikatop.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = klinikatop.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name klinikatop.uz www.klinikatop.uz;
    return 404; # managed by Certbot




}