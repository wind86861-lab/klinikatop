# Shifo — ALOHIDA server bloki.
# banisa.uz konfiguratsiyasiga tegilmaydi: nginx so'rovni server_name
# bo'yicha ajratadi, ikkalasi bir-birini bilmaydi.
#
# Yoqish (domen tayyor bo'lgach):
#   sed -i 's/klinikatop.uz www.klinikatop.uz/shifo.example.uz/g' /etc/nginx/sites-available/klinikatop
#   ln -s /etc/nginx/sites-available/klinikatop /etc/nginx/sites-enabled/klinikatop
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d shifo.example.uz

server {
    server_name klinikatop.uz www.klinikatop.uz;

    root /opt/klinikatop/webapp;
    index index.html;

    # nginx versiyasi javob sarlavhasida ko'rinmasin
    server_tokens off;

    include /etc/nginx/snippets/klinikatop-security.conf;

    # ── Siqish ──
    #
    # nginx.conf da `gzip on` bor, lekin `gzip_types` izohga olingan va
    # sukut bo'yicha faqat text/html siqiladi. Natijada JS va CSS xom
    # holda ketardi: 203 KB o'rniga 59 KB bo'lishi mumkin edi.
    #
    # Sekin mobil tarmoqda bu farq bir necha soniya — ilova "og'ir
    # ishlaydi" degan tuyg'u aynan shundan.
    #
    # Sozlama SHU BLOK ichida: banisa.uz konfiguratsiyasiga tegilmaydi.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    # 1 KB dan kichigini siqish foyda bermaydi — sarlavha o'zi shuncha
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Telegram Mini App — SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    #
    # `index.html` HECH QACHON keshlanmaydi.
    #
    # U hash bilan nomlangan JS fayllarga ishora qiladi va har deploy'da
    # eski fayllar o'chiriladi. Sarlavhasiz brauzer (ayniqsa Telegram
    # WebView) index.html ni evristik bilan keshlab qo'yardi — natijada
    # eski qobiq allaqachon yo'q bo'lgan skriptni chaqirib, ilova
    # umuman ochilmasdi (qora ekran).
    #
    # Asset'lar esa immutable bo'lib qolaveradi: ular hash bilan
    # nomlangan, ya'ni o'zgarsa nomi ham o'zgaradi.
    #
    location = /index.html {
        # `expires` o'zining Cache-Control ini qo'shadi — sarlavha
        # ikki marta chiqmasligi uchun faqat bittasi ishlatiladi
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Bu blokdagi `add_header` yuqoridagilarni bekor qiladi —
        # shuning uchun xavfsizlik sarlavhalari qayta ulanadi
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    # Hash bilan nomlangan asset'lar
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/klinikatop-security.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI javobi SSE bilan oqadi — buferlash oqimni to'xtatadi
        proxy_buffering off;
        proxy_read_timeout 120s;

        # Tibbiy hujjat 8 MB, base64 bilan ~11 MB
        client_max_body_size 12m;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/klinikatop.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/klinikatop.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.klinikatop.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = klinikatop.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name klinikatop.uz www.klinikatop.uz;
    return 404; # managed by Certbot




}