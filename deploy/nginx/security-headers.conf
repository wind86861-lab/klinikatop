#
# Xavfsizlik sarlavhalari — barcha javoblarga.
#
# ALOHIDA FAYL va bu ataylab: nginx'da `add_header` ichki `location`
# blokida qayta e'lon qilinsa, YUQORIDAGI barcha `add_header` lar
# BEKOR bo'ladi. Bizda `/index.html` va `/assets/` bloklarida o'z
# `Cache-Control` i bor — ya'ni ular sarlavhalarni jimgina yo'qotardi.
#
# Shuning uchun bu fayl har bir shunday blokka ham `include` qilinadi.
#

# HTTPS majburiy. Sayt allaqachon faqat TLS orqali ishlaydi va
# sertifikat certbot bilan avtomatik yangilanadi.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Brauzer `Content-Type` ni taxmin qilmasin. Tibbiy hujjatlar
# foydalanuvchi yuklagan fayllar — ularni "rasm emas, sahifa" deb
# talqin qilish XSS yo'lini ochardi.
add_header X-Content-Type-Options "nosniff" always;

# Manzilda bitim va so'rov raqamlari bor — ular begona saytga
# `Referer` sarlavhasida ketmasin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ilova kamera, mikrofon, joylashuv so'ramaydi.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

#
# Faqat `frame-ancestors` — to'liq CSP emas.
#
# Ilova Telegram Mini App: ish stolidagi Telegram uni IFRAME ichida
# ochadi, shuning uchun `X-Frame-Options: DENY` mini ilovani buzardi.
# `frame-ancestors` esa Telegramga ruxsat berib, qolgan hammani
# to'sadi — clickjacking yo'li yopiladi.
#
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
